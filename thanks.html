<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>buzz received ✿ daisy digital</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&family=Instrument+Serif:ital@1&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="glitter" aria-hidden="true"></canvas>
  <div class="toast" role="status" aria-live="polite"></div>
  <main class="page">
    <div class="window" style="max-width:520px;margin:0 auto;border-radius:30px">
      <div class="window-bar"><span class="title" style="justify-content:center">messages</span></div>
      <div class="chat" style="padding:24px">
        <div class="bub me" data-thanks-msg>sent you a buzz 🐝</div>
        <span class="read">read just now</span>
        <div class="bub them">omg hiii 💌 got it!</div>
        <div class="bub them" data-thanks-reply>we'll slide back into your inbox soon. stay cute <span class="xo" style="--hot:var(--bubblegum)">xo</span></div>
      </div>
      <div class="screen-hero" style="min-height:0;padding:0 24px 30px">
        <span data-sprite="bri" style="width:90px;display:block"></span>
        <a class="btn" href="index.html">back to the site ✿</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
  <script>
    if (new URLSearchParams(location.search).get("from") === "join") {
      document.querySelector("[data-thanks-msg]").textContent = "sent my application 🌱";
      document.querySelector("[data-thanks-reply]").innerHTML = 'your application is planted! we\'ll be in touch once it blooms <span class="xo" style="--hot:var(--bubblegum)">xo</span>';
    }
  </script>
</body>
</html>
